[package]
name = "drm"
description = "Safe, low-level bindings to the Direct Rendering Manager API"
repository = "https://github.com/Smithay/drm-rs"
version = "0.14.1"
license = "MIT"
authors = ["Tyler Slabinski <tslabinski@slabity.net>", "Victoria Brekenfeld <crates-io@drakulix.de>"]
exclude = [".gitignore", ".github"]
rust-version = "1.66"
edition = "2021"

[dependencies]
bitflags = "2"
bytemuck = { version = "1.12", features = ["extern_crate_alloc", "derive"] }
drm-ffi = { path = "drm-ffi", version = "0.9.0" }
drm-fourcc = "^2.2.0"
rustix = { version = "0.38.22", features = ["mm", "fs"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
rustix = { version = "0.38.22", features = ["event", "mm"] }
rustyline = "13"

[features]
use_bindgen = ["drm-ffi/use_bindgen"]

[workspace]
members = [
    "drm-ffi",
    "drm-ffi/drm-sys",
]

[patch.crates-io]
libc = { git = 'https://github.com/helce/libc', branch = 'devel_e2k' }
rustix_main = { package = 'rustix', git = 'https://github.com/helce/rustix', branch = 'devel_e2k' }
rustix_038 = { package = 'rustix', git = 'https://github.com/helce/rustix', branch = 'devel_e2k_0.38' }
linux-raw-sys_04 = { package = 'linux-raw-sys', git = 'https://github.com/helce/linux-raw-sys', branch = 'devel_e2k_0.4' }
linux-raw-sys_06 = { package = 'linux-raw-sys', git = 'https://github.com/helce/linux-raw-sys', tag = 'v0.6.5'}
linux-raw-sys_12 = { package = 'linux-raw-sys', git = 'https://github.com/helce/linux-raw-sys', tag = 'v0.12.1'}
